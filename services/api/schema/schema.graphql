# Cumplify API Core — GraphQL Schema (M1–M5)
# Auth modes: @aws_lambda (user-facing, default), @aws_iam (agent/service)
# Per design §2.2: every user-facing operation annotated @aws_lambda;
# agent-path mutations annotated @aws_iam; subscriptions use None data source.
# SCHEMA-5: no tenantId in mutation inputs — resolvers overwrite from resolverContext.

# ─── Scalars & Enums ─────────────────────────────────────────────────────────

scalar AWSDateTime
scalar AWSJSON

enum Standard {
  ISO9001
  ISO14001
  ISO45001
  IMS
}

enum DocumentStatus {
  DRAFT
  IN_REVIEW
  APPROVED
  OBSOLETE
}

enum DocumentType {
  MANUAL
  PROCEDURE
  WORK_INSTRUCTION
  POLICY
  SCOPE
  CORRELATION_MATRIX
  MASTER_LIST
}

enum NCType {
  NONCONFORMING_OUTPUT
  NC
  INCIDENT
}

enum NCSource {
  AUDIT
  INCIDENT
  COMPLAINT
  PROCESS
}

enum Severity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum CAPAStatus {
  OPEN
  IN_PROGRESS
  CLOSED
  VERIFIED
}

enum FindingType {
  MAJOR_NC
  MINOR_NC
  OBSERVATION
  OFI
}

enum ApprovalDecision {
  APPROVED
  REJECTED
  RETURNED
}

enum RiskCategory {
  QUALITY
  ENVIRONMENTAL
  OHS
  OPPORTUNITY
}

enum Disposition {
  REWORK
  SCRAP
  CONCESSION
  REGRADE
}

# ─── M1: Document Studio Types ────────────────────────────────────────────────

type Document @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  docType: DocumentType!
  title: String!
  status: DocumentStatus!
  ownerId: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  # RS-1 (read-surface-completion): m1.documents.clause_refs TEXT[] already
  # selected by SELECT * in getDocument/listDocuments; shared marshal already
  # unwraps arrayValue + snake->camelCases the column. SDL-only — found
  # live-broken 2026-07-21 (P2 S2's /documents already queries this field).
  clauseRefs: [String!]
}

type DocumentVersion @aws_lambda @aws_iam {
  id: ID!
  documentId: ID!
  versionNo: Int!
  contentRef: String!
  changeSummary: String
