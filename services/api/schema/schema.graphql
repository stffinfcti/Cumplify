# read-surface-completion RS-8 — "AI does the heavy lifting" user-triggered
# agent runs. Async ack: the run is dispatched (fire-and-forget Lambda
# Invoke, Event type — a synchronous RequestResponse call risks exceeding
# AppSync's ~30s direct-Lambda-resolver ceiling under real Bedrock latency,
# especially with the one-door invoker's internal grounding/AR retries).
# The HITL card (listPendingHitlItems) is the real deliverable, not this
# return value — status here only reflects successful DISPATCH.
type AgentRunAck @aws_lambda {
  runId: ID!
  status: String!
}

# One-time Stripe Billing Portal URL (createBillingPortalSession). The /billing
# page redirects the admin to `url`; the session is minted server-side against
# the tenant's Stripe customer — no key or customer id ever reaches the client.
type BillingPortalSession @aws_lambda {
  url: String!
}

