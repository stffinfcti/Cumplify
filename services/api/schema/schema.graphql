# read-surface-completion RS-7 (owner-ruled 2026-07-22, SCHEMA-5 exception):
# these four Input types + agentGenerateChecklist/agentScoreReadiness below
# carry an explicit tenantId. The six agent* mutations are @aws_iam-only
# (api-stack.ts: primary auth is the Lambda authorizer; IAM is an ADDITIONAL
# mode, and a field with only @aws_iam is IAM-only, so the authorizer never
# runs) — resolverContext.tenantId, which every other resolver relies on via
# extractContext, is simply never populated for these calls. SCHEMA-5's
# threat model is a malicious BROWSER client spoofing tenantId; these
# mutations are only reachable with signed AWS IAM (SigV4) credentials,
# never exposed to a browser, so the same spoofing risk does not apply.
# Narrow, explicit, owner-approved exception — NOT a precedent for any
# @aws_lambda (human-facing) mutation.
input AgentDraftDocumentInput {
  tenantId: ID!
  standard: Standard!
  docType: DocumentType!
  title: String!
  contentRef: String!
}

input AgentTriageNCInput {
  tenantId: ID!
  ncId: ID!
  classification: String!
}

input AgentProposeCorrectiveActionInput {
  tenantId: ID!
  ncId: ID!
  actionDesc: String!
  suggestedOwnerId: String!
}

input AgentAssessRiskInput {
  tenantId: ID!
  riskId: ID!
  likelihood: Int!
  severity: Int!
  rationale: String!
}

# Subscription trigger inputs (None data source)
# SCHEMA-5 exception (same owner-ruled RS-7 carve-out as the agent* inputs):
# the four subscription-trigger mutations are @aws_iam-only — resolverContext
# never exists on IAM-signed calls, so tenantId travels in the input.
input DocumentEventInput {
  tenantId: ID!
  documentId: ID!
  status: DocumentStatus!
}

input CAPAEventInput {
  tenantId: ID!
  capaId: ID!
  status: CAPAStatus!
}

input AuditEventTriggerInput {
  tenantId: ID!
  auditId: ID!
  findingType: FindingType
}

input RiskEventInput {
  tenantId: ID!
  riskId: ID!
  riskRating: Int!
}

# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  # M1 — Document Studio
  getDocument(id: ID!): Document @aws_lambda
  listDocuments(standard: Standard, status: DocumentStatus): [Document!]! @aws_lambda
  listDocumentVersions(documentId: ID!): [DocumentVersion!]! @aws_lambda
  getDocumentVersionDiff(v1: ID!, v2: ID!): Diff @aws_lambda
  getDocumentContent(versionId: ID!): AWSJSON @aws_lambda

  # M2 — CAPA
  getNonconformity(id: ID!): Nonconformity @aws_lambda
  listNonconformities(standard: Standard, severity: Severity): [Nonconformity!]! @aws_lambda
  listOpenCAPAs(standard: Standard, severity: Severity): [CorrectiveAction!]! @aws_lambda
  listCorrectiveActions(ncId: ID!): [CorrectiveAction!]! @aws_lambda
  # C1 (CAPA Studio RCA): approved root-cause analyses for an NC
  listRootCauseAnalyses(ncId: ID!): [RootCauseAnalysis!]! @aws_lambda

  # M3 — Audit Studio
  getAudit(id: ID!): Audit @aws_lambda
  # S4 (Audit Studio): register + per-audit read surfaces
  listAudits: [Audit!]! @aws_lambda
  listAuditFindings(auditId: ID!): [AuditFinding!]! @aws_lambda
  listAuditChecklists(auditId: ID!): [AuditChecklist!]! @aws_lambda
  getAuditReadiness(standard: Standard!): [ReadinessScore!]! @aws_lambda

  # M4 — Records Management
  getRecord(id: ID!): Record @aws_lambda
  listCalibrationsDue(windowDays: Int!): [CalibrationRecord!]! @aws_lambda
  getAuditTrail(entityId: ID!): [AuditEvent!]! @aws_lambda
  listApprovalMatrix: [ApprovalMatrixEntry!]! @aws_lambda

  # M5 — Risk Management
  getRisk(id: ID!): Risk @aws_lambda
  getCrossRegisterRiskView(standard: Standard, category: RiskCategory): [Risk!]! @aws_lambda

  # Guru advisory queries (user-facing, routed via ComplianceCopilot)
  # Auth: @aws_lambda (Lambda authorizer — tenant claim + role verified)
  askISO9001(question: String!, queryVector: AWSJSON): String! @aws_lambda
  askISO14001(question: String!, queryVector: AWSJSON): String! @aws_lambda
  askISO45001(question: String!, queryVector: AWSJSON): String! @aws_lambda

  # Spec 9 (frontend-app) — AppSync does not support extend-type blocks;
  # new fields live in the base type (live failure 2x: field 404 on resolver create)
  listPendingHitlItems(pagination: PaginationInput): HitlItemConnection! @aws_lambda
  getProfile: UserProfile @aws_lambda

  # Architect additive 2026-07-14 (Task 31 Settings unblock, AM-3 read-only
  # side): tenant name + tenant default document-locale, read-only. Write
  # path is a named carry to the settings-ui spec — no mutation here.
  getTenantSettings: TenantSettings @aws_lambda

  # Spec 41 — QMS Forms & Records Engine
  listFormTemplates: [FormTemplate!]! @aws_lambda
  getFormTemplate(id: ID!): FormTemplate @aws_lambda
  # Task 10 (OQ-2 gate): paginated, newest first — server default 100, cap 500.
  listFormRecords(templateId: ID!, status: FormRecordStatus, limit: Int, offset: Int): [FormRecord!]! @aws_lambda
  getFormRecord(id: ID!): FormRecord @aws_lambda

  # Spec 40 — QMS Document Engine
  getOrgProfile: OrgProfile @aws_lambda
  listClauseRegistry(standard: Standard): [ClauseRegistryEntry!]! @aws_lambda
  listClauseApplicability: [ClauseApplicability!]! @aws_lambda
  getGenerationRun(id: ID!): GenerationRun @aws_lambda
  listGenerationRuns(limit: Int): [GenerationRun!]! @aws_lambda
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # M1 — Document Studio (user-facing)
  createDocumentDraft(input: CreateDocumentDraftInput!): Document! @aws_lambda
  submitDocumentForApproval(id: ID!): Document! @aws_lambda
  approveDocumentVersion(input: ApproveDocumentVersionInput!): DocumentApproval! @aws_lambda
  publishControlledDocument(versionId: ID!): Document! @aws_lambda
  updatePolicy(input: UpdatePolicyInput!): Policy! @aws_lambda
  updateImsScope(input: UpdateImsScopeInput!): ImsScope! @aws_lambda

  # M2 — CAPA (user-facing)
  raiseNonconformity(input: RaiseNonconformityInput!): Nonconformity! @aws_lambda
  recordRootCause(input: RecordRootCauseInput!): RootCauseAnalysis! @aws_lambda
  createCorrectiveAction(input: CreateCorrectiveActionInput!): CorrectiveAction! @aws_lambda
  closeCapa(input: CloseCapaInput!): CorrectiveAction! @aws_lambda
  verifyEffectiveness(input: VerifyEffectivenessInput!): CapaEffectivenessCheck! @aws_lambda
  disposeNonconformingOutput(input: DisposeNonconformingOutputInput!): NonconformingOutput! @aws_lambda
  # RS-8: "AI: draft this" on the M2 CAPA drawer — invokes CAPAGuru with the
  # NC's current stage context, stage-aware per the CAPA shall-workflow.
  runCapaAnalysis(ncId: ID!): AgentRunAck! @aws_lambda
  # S1 (studio wave): stage-1 intake — plain-language problem report in,
  # CAPAGuru-drafted NC proposal out (nc-draft-write HITL card).
  runNcIntake(description: String!, evidenceNote: String): AgentRunAck! @aws_lambda
  # C1 (CAPA Studio RCA): CAPAGuru performs a structured root-cause analysis
  # (5 Whys / Ishikawa fishbone / fault tree) on an NC; the rca-write HITL
  # card is the deliverable, approval persists m2.root_cause_analyses.
  runRootCauseAnalysis(ncId: ID!, method: RcaMethod!): AgentRunAck! @aws_lambda
  # S2 (studio wave): Document Studio — describe the document you need,
  # DocStudio drafts it whole (title, clauses, sections) via the doc-draft
  # HITL card; approval creates the DRAFT document with real content.
  runDocDraft(intent: String!, docType: DocumentType, standard: Standard): AgentRunAck! @aws_lambda
  # S3 (studio wave): Manual Studio gap burn-down — DocStudio drafts prose for
  # ONE generation-run section (a GAP, a failure, or a redraft); the
  # manual-section-draft HITL card is the deliverable, approval regenerates
  # the manual/clause-doc/master-list versions through the GEN-6 engine.
  runManualSectionDraft(runId: ID!, harmonizationKey: String!): AgentRunAck! @aws_lambda

  # M3 — Audit Studio (user-facing)
  createAuditProgramme(input: CreateAuditProgrammeInput!): AuditProgramme! @aws_lambda
  scheduleAudit(input: ScheduleAuditInput!): Audit! @aws_lambda
  recordFinding(input: RecordFindingInput!): AuditFinding! @aws_lambda
  completeAudit(id: ID!): Audit! @aws_lambda
  generateAuditChecklist(auditId: ID!): [AuditChecklist!]! @aws_lambda
  # S4 (Audit Studio): LeadAuditor proposes the most significant finding for
  # the audit (objective evidence from the checklist); the audit-finding-write
  # HITL card is the deliverable. Approving a major/minor NC finding ALSO
  # opens the NC in CAPA Studio (cross-studio loop).
  runAuditFindings(auditId: ID!): AgentRunAck! @aws_lambda

  # M4 — Records Management (user-facing)
  registerRecord(input: RegisterRecordInput!): Record! @aws_lambda
  registerMeasuringResource(input: RegisterMeasuringResourceInput!): MeasuringResource! @aws_lambda
  recordCalibration(input: RecordCalibrationInput!): CalibrationRecord! @aws_lambda
  createRetentionPolicy(input: CreateRetentionPolicyInput!): RetentionPolicy! @aws_lambda
  setApprovalMatrixEntry(input: SetApprovalMatrixEntryInput!): ApprovalMatrixEntry! @aws_lambda

  # M5 — Risk Management (user-facing)
  createRisk(input: CreateRiskInput!): Risk! @aws_lambda
  addRiskTreatment(input: AddRiskTreatmentInput!): RiskTreatment! @aws_lambda
  createChangePlan(input: CreateChangePlanInput!): ChangePlan! @aws_lambda
  # RS-8: "AI: draft this" on the /risk register row/drawer — invokes the
  # RiskSentinel seat with the risk's current context.
  runRiskAssessment(riskId: ID!): AgentRunAck! @aws_lambda

  # Billing — subscription management. Mints a one-time Stripe Customer Portal
  # session for the caller's tenant; the /billing page redirects to the URL.
  # tenantId is injected from resolverContext (SCHEMA-5); returnUrl is where
  # Stripe sends the admin back after they close the portal.
  createBillingPortalSession(returnUrl: String!): BillingPortalSession! @aws_lambda

  # Agent-path mutations (@aws_iam)
  agentDraftDocument(input: AgentDraftDocumentInput!): Document! @aws_iam
  agentTriageNC(input: AgentTriageNCInput!): Nonconformity! @aws_iam
  agentProposeCorrectiveAction(input: AgentProposeCorrectiveActionInput!): CorrectiveAction! @aws_iam
  agentGenerateChecklist(auditId: ID!, tenantId: ID!): [AuditChecklist!]! @aws_iam
  agentScoreReadiness(standard: Standard!, tenantId: ID!): [ReadinessScore!]! @aws_iam
  agentAssessRisk(input: AgentAssessRiskInput!): Risk! @aws_iam
  publishGenerationEvent(input: PublishGenerationEventInput!): GenerationEvent @aws_iam

  # Subscription triggers (None data source, @aws_iam)
  publishDocumentEvent(input: DocumentEventInput!): Document @aws_iam
  publishCAPAEvent(input: CAPAEventInput!): CorrectiveAction @aws_iam
  publishAuditEvent(input: AuditEventTriggerInput!): AuditFinding @aws_iam
  publishRiskEvent(input: RiskEventInput!): Risk @aws_iam

  # Spec 9 (frontend-app)
  approveHitlItem(input: ApproveHitlItemInput!): HitlApprovalResult! @aws_lambda
  updateProfile(input: UpdateProfileInput!): UserProfile! @aws_lambda

  # Spec 41 — QMS Forms & Records Engine
  createFormRecord(templateId: ID!): FormRecord! @aws_lambda
  saveFormRecordValues(input: SaveFormRecordValuesInput!): FormRecord! @aws_lambda
  submitFormRecord(input: SubmitFormRecordInput!): FormRecord! @aws_lambda
  approveFormRecord(input: ApproveFormRecordInput!): FormRecord! @aws_lambda
  reopenFormRecord(input: ReopenFormRecordInput!): FormRecord! @aws_lambda
  exportFormRecordPdf(recordId: ID!): ExportResult! @aws_lambda

  # Spec 40 — QMS Document Engine
  saveOrgProfile(input: SaveOrgProfileInput!): OrgProfile! @aws_lambda
  setClauseApplicability(input: SetClauseApplicabilityInput!): ClauseApplicability! @aws_lambda
  generateImsManual(input: GenerateImsManualInput): GenerationRun! @aws_lambda
  regenerateSection(input: RegenerateSectionInput!): GenerationSection! @aws_lambda
  markSectionReviewed(input: MarkSectionReviewedInput!): GenerationSection! @aws_lambda
  requestImsExport(documentId: ID!): ExportResult! @aws_lambda

  # read-surface-completion RS-9 (Collaboration Law persistence) — Document
  # Studio editor sync. harmonizationKey, not sectionIndex (the requirements
  # doc's literal name): matches both the existing content-JSON convention
  # (ContentSection is keyed by harmonizationKey, never a numeric index) and
  # the already-shipped Document Studio editor's SectionDraft shape
  # (frontend/src/components/document-editor/attribution.ts) — amended at
  # build time, same class of refinement as RS-6's storage design.
  saveDocumentSectionEdit(input: SaveDocumentSectionEditInput!): DocumentVersion! @aws_lambda
}

# ─── Subscriptions ────────────────────────────────────────────────────────────
# All use None data source. Subscription resolvers verify tenantId from
# resolverContext matches the argument (C-6). Delivered via @aws_lambda auth.

type Subscription {
  onDocumentStatusChanged(tenantId: ID!): Document
    @aws_subscribe(mutations: ["publishDocumentEvent"])
    @aws_lambda

  onCAPAStatusChanged(tenantId: ID!): CorrectiveAction
    @aws_subscribe(mutations: ["publishCAPAEvent"])
    @aws_lambda

  onFindingRecorded(tenantId: ID!): AuditFinding
    @aws_subscribe(mutations: ["publishAuditEvent"])
    @aws_lambda

  onCalibrationDue(tenantId: ID!): CalibrationRecord
    @aws_lambda

  onRiskEscalated(tenantId: ID!): Risk
    @aws_subscribe(mutations: ["publishRiskEvent"])
    @aws_lambda

  # Spec 9 (frontend-app)
  onHitlItemResolved(tenantId: ID!): HitlApprovalResult
    @aws_subscribe(mutations: ["approveHitlItem"])
    @aws_lambda

  # Spec 40 (qms-document-engine) — Task 7 wires the auth resolver
  onGenerationProgress(tenantId: ID!): GenerationEvent
    @aws_subscribe(mutations: ["publishGenerationEvent"])
    @aws_lambda
}

# ─── Spec 9 (frontend-app): HITL + Profile Schema Surface ─────────────────────

enum HitlDecision {
  APPROVE
  SEND_BACK
}

type GuardrailEvidence @aws_lambda {
  groundingScore: Float
  relevanceScore: Float
  arVerdict: String
  arDetails: String
  citations: [Citation!]
  flagged: Boolean
  flaggedApproval: FlaggedApproval
}

type FlaggedApproval @aws_lambda {
  justification: String!
  approverSub: String!
  timestamp: AWSDateTime!
}

type Citation @aws_lambda {
  clauseRef: String!
  sourceChunk: String
  score: Float
}

type HitlItem @aws_lambda {
  hitlItemId: ID!
  agentName: String!
  clauseRef: String
  standard: Standard
  module: String!
  draftBody: String!
  status: String!
  createdAt: AWSDateTime!
  guardrailEvidence: GuardrailEvidence
}

type HitlApprovalResult @aws_lambda {
  hitlItemId: ID!
  # AppSync delivers onHitlItemResolved(tenantId:) only when the mutation
  # result carries a matching tenantId field — required for delivery, in
  # addition to the C-6 subscription auth check.
  tenantId: ID!
  decision: HitlDecision!
  auditEventId: String!
  auditEventTimestamp: AWSDateTime!
  resolvedBy: String!
  resolvedAt: AWSDateTime!
}

input ApproveHitlItemInput {
  hitlItemId: ID!
  decision: HitlDecision!
  editedPayload: AWSJSON
  note: String
  justification: String
}

input PaginationInput {
  limit: Int
  nextToken: String
}

type HitlItemConnection @aws_lambda {
  items: [HitlItem!]!
  nextToken: String
}

type UserProfile @aws_lambda {
  userId: ID!
  locale: String!
  updatedAt: AWSDateTime
}

input UpdateProfileInput {
  locale: String!
}

type TenantSettings @aws_lambda {
  tenantName: String!
  documentLocale: String!
}

